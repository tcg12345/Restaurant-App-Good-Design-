<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gourmet Canvas</title>
  <meta name="description" content="Gourmet Canvas — support and privacy information." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ede7d9; --paper: #fdfaf0; --ink: #1e1b1a; --ink-2: #3d3835;
      --ink-3: #6b6359; --line: #d2cec0; --clay: #9f3012;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131314; --paper: #18181a; --ink: #ededed; --ink-2: #c2c2c2;
        --ink-3: #8a8a8a; --line: #2a2a2c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--ink);
      font-family: "Manrope", system-ui, -apple-system, sans-serif;
      text-align: center; padding: 24px;
    }
    .mark {
      width: 56px; height: 56px; border-radius: 15px; margin: 0 auto 18px;
      background: var(--clay); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: "Fraunces", serif; font-style: italic; font-size: 29px; font-weight: 600;
    }
    h1 { font-family: "Fraunces", serif; font-size: 34px; font-weight: 600; margin: 0 0 8px; }
    p { color: var(--ink-3); margin: 0 0 28px; font-size: 15px; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block; text-decoration: none; font-weight: 600; font-size: 15px;
      padding: 12px 26px; border-radius: 999px; color: var(--ink);
      background: var(--paper); border: 1px solid var(--line);
    }
    a.primary { background: var(--clay); border-color: var(--clay); color: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="mark">G</div>
    <h1>Gourmet Canvas</h1>
    <p>A dining journal for rating restaurants, sharing reviews, and finding your next favorite table.</p>
    <div class="links">
      <a class="primary" href="support.html">Support</a>
      <a href="privacy.html">Privacy policy</a>
    </div>
  </main>
</body>
</html>
