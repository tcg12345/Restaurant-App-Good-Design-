<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 stops iOS Safari from auto-zooming when the user
         taps an input whose font-size is under 16 px. The app uses a
         lot of smaller inputs (search bars, captions, sliders) where
         bumping the font-size would change the design, so we lock the
         page zoom instead — matches how native apps behave inside
         Capacitor. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Gourmet Canvas</title>
    <!-- Theme before the first pixel. SettingsContext owns this decision;
         this repeats its rule inline because applying the `dark` class from
         a React effect happens after the first paint, so every dark launch
         flashed the light surface first. Same key, same rule — a fresh
         install (nothing stored) follows the system, and once the user has
         picked a side in Settings that choice wins. Keep in sync with
         src/contexts/SettingsContext.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('gourmad-dark-mode');
          var dark = stored === null
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : stored === '1';
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* storage blocked — the app re-decides on mount */ }
      })();
    </script>
    <!-- Fonts are self-hosted (public/fonts, generated by
         scripts/fetch-fonts.mjs) so the bundled iOS app renders its own
         typography offline instead of depending on fonts.googleapis.com. -->
    <link rel="stylesheet" href="/fonts/fonts.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
