<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 stops iOS Safari from auto-zooming when the user
         taps an input whose font-size is under 16 px. The app uses a
         lot of smaller inputs (search bars, captions, sliders) where
         bumping the font-size would change the design, so we lock the
         page zoom instead — matches how native apps behave inside
         Capacitor. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Gourmet Canvas</title>
    <!-- Fonts are self-hosted (public/fonts, generated by
         scripts/fetch-fonts.mjs) so the bundled iOS app renders its own
         typography offline instead of depending on fonts.googleapis.com. -->
    <link rel="stylesheet" href="/fonts/fonts.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
