<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 stops iOS Safari from auto-zooming when the user
         taps an input whose font-size is under 16 px. The app uses a
         lot of smaller inputs (search bars, captions, sliders) where
         bumping the font-size would change the design, so we lock the
         page zoom instead — matches how native apps behave inside
         Capacitor. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>GoodEats</title>
    <meta name="description" content="Rank the restaurants you've been to, keep the ones you want to try, and see what the people you trust are eating." />
    <meta name="theme-color" content="#1c1a19" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GoodEats" />
    <meta property="og:description" content="Rank the restaurants you've been to, keep the ones you want to try, and see what the people you trust are eating." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GoodEats" />
    <meta name="twitter:image" content="/og-image.png" />
    <!-- Theme before the first pixel. SettingsContext owns this decision;
         this repeats its rule inline because applying the `dark` class from
         a React effect happens after the first paint, so every dark launch
         flashed the light surface first. Same key, same rule — a fresh
         install (nothing stored) follows the system, and once the user has
         picked a side in Settings that choice wins. Keep in sync with
         src/contexts/SettingsContext.tsx. -->
    <script>
      (function () {
        try {
          // The pre-rename key is the fallback, not an equal alternative:
          // this runs BEFORE the bundle, so on the first launch after the
          // GoodEats rename lib/storage-migration.ts has not copied
          // anything yet and the new key does not exist. Without the
          // fallback every dark-mode user gets one white flash on the one
          // launch where the app changed its name — the worst possible
          // moment to look broken.
          var stored = localStorage.getItem('goodeats-dark-mode');
          if (stored === null) stored = localStorage.getItem('gourmad-dark-mode');
          var dark = stored === null
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : stored === '1';
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* storage blocked — the app re-decides on mount */ }
      })();
    </script>
    <!-- Fonts are self-hosted (public/fonts, generated by
         scripts/fetch-fonts.mjs) so the bundled iOS app renders its own
         typography offline instead of depending on fonts.googleapis.com. -->
    <link rel="stylesheet" href="/fonts/fonts.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
