# Supabase CLI configuration.
#
# Set project_id to your project ref (the subdomain of your Supabase URL),
# or run `supabase link --project-ref <ref>` which records it for you.
project_id = "YOUR_PROJECT_REF"

# The AI Edge Functions are called from the browser and the native app with
# CORS. Browsers don't send an Authorization header on the preflight OPTIONS
# request, so the gateway's JWT check would 401 the preflight and break CORS.
# We therefore disable the gateway check and verify the caller's token inside
# each function instead (see functions/_shared/auth.ts → requireUser).
[functions.location-chat]
verify_jwt = false

[functions.build-recipe]
verify_jwt = false

[functions.import-recipe]
verify_jwt = false

[functions.import-restaurants]
verify_jwt = false

[functions.generate-recipe-image]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

# cuisine-lookup is called from the browser too, and verifies the caller
# itself (requireUser) before spending an Overpass request.
[functions.cuisine-lookup]
verify_jwt = false

# mux-upload-init verifies the caller's JWT itself (requireUser) and must answer
# the CORS preflight, so the gateway check stays off — same as the AI functions.
[functions.mux-upload-init]
verify_jwt = false

# Same pattern for the other browser-called Mux functions.
[functions.mux-playback-token]
verify_jwt = false

[functions.delete-media]
verify_jwt = false

[functions.mux-set-visibility]
verify_jwt = false

# mux-webhook is called server-to-server by Mux, which can't present a Supabase
# JWT; it authenticates via the Mux-Signature HMAC instead.
[functions.mux-webhook]
verify_jwt = false

# Billing (migration 087). billing-webhook is called server-to-server by
# RevenueCat, which can't present a Supabase JWT; it authenticates with a
# shared secret instead. The other three verify the caller themselves and
# must answer the CORS preflight.
[functions.billing-webhook]
verify_jwt = false

[functions.billing-sync]
verify_jwt = false

[functions.billing-checkout]
verify_jwt = false

[functions.billing-portal]
verify_jwt = false

# Authenticated inside the handler; OPTIONS preflight is public.
[functions.group-swipe]
verify_jwt = false

# JWT validated with requireUser; membership checked against the room snapshot.
[functions.group-place-summary]
verify_jwt = false

# Retired legacy provider endpoints; defense in depth in addition to 410 handlers.
[functions.determine-cuisine]
verify_jwt = true

[functions.perplexity-restaurant-info]
verify_jwt = true

# A private scheduler secret is checked in the handler; no user JWT can send pushes.
[functions.push-dispatch]
verify_jwt = false

[functions.geocode]
verify_jwt = true

[functions.set-mapbox-token]
verify_jwt = true

[functions.get-mapbox-token]
